name: Verify data

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Verify the promise index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify promises against the KJV text and derived files
        run: python3 scripts/verify_promises.py

      - name: Confirm derived files are in sync with promises.json
        run: |
          python3 scripts/build_derived.py
          if ! git diff --quiet -- data/; then
            echo "::error::data/promises.csv, data/books.json or data/categories.json is out of date."
            echo "Run 'python3 scripts/build_derived.py' and commit the result."
            git --no-pager diff --stat -- data/
            exit 1
          fi
